repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        language_version: python3.12
        # The trainer needs torch, which this hook's environment leaves out; `uv run mypy training`
        # checks it from the `ml` environment instead.
        exclude: ^training/
        additional_dependencies: [pydantic, loguru, pytest, streamlit==1.57.0, numpy, onnxruntime]
